name: Security Scan Docker Packages
run-name: >
  Security Scan
on:
  workflow_dispatch:
    inputs:
      only-high-critical:
        description: "Scope only HIGH + CRITICAL"
        required: false
        default: true
        type: boolean
      trivy-scan:
        description: "Trivy scan"
        required: false
        default: true
        type: boolean
      grype-scan:
        description: "Grype scan"
        required: false
        default: true
        type: boolean
      continue-on-error:
        description: "Continue on error"
        required: false
        default: true
        type: boolean
      only-fixed:
        description: "Ignore unfixed vulnerabilities"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 3 * * 0" # every Sunday at 03:00 UTC
permissions:
  contents: read

env:
  CONFIG_FILE: .github/sec-scan-config.yaml
jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.config.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Read config
        id: config
        run: |
          echo "only-high-critical: ${{ inputs.only-high-critical }}"
          echo "trivy-scan: ${{ inputs.trivy-scan }}"
          echo "grype-scan: ${{ inputs.grype-scan }}"
          echo "continue-on-error: ${{ inputs.continue-on-error }}"
          echo "only-fixed: ${{ inputs.only-fixed }}"
          echo "1. ==================================================================================="
          yq -oj '.' $CONFIG_FILE
          echo "2. ==================================================================================="
          yq -oj '.' $CONFIG_FILE | jq -c 'to_entries | map({repo: .key, image: .value[]}) | {packages: .}'
          echo "3. ==================================================================================="

          packages=$(yq -oj '.' $CONFIG_FILE | jq -c 'to_entries | map({repo: .key, image: .value[]})')
          echo "packages=$packages" >> $GITHUB_OUTPUT

  security-scan-matrix:
    needs: load-config
    permissions:
      security-events: write
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        package: "${{ fromJson(needs.load-config.outputs.packages) }}"
    name: "${{ matrix.package.image }}"
    uses: netcracker/qubership-workflow-hub/.github/workflows/re-security-scan.yml@v2.0.10
    with:
      target: 'docker'
      image: ${{ matrix.package.image }}
      only-high-critical: ${{ (github.event_name == 'schedule' && true) || inputs.only-high-critical }}
      trivy-scan: ${{ (github.event_name == 'schedule' && true) || inputs.trivy-scan }}
      grype-scan: ${{ (github.event_name == 'schedule' && true) || inputs.grype-scan }}
      continue-on-error: ${{ (github.event_name == 'schedule' && true) || inputs.continue-on-error }}
      only-fixed: ${{ (github.event_name == 'schedule' && true) || inputs.only-fixed }}
      upload-sarif-to-security: true

  create-report:
    needs: [security-scan-matrix]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: repo
          persist-credentials: true
          ref: gh_pages
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*.sarif'
          path: ./sarif
          merge-multiple: true

      - name: Install CSV-KIT
        run: |
          cargo install csv2html

      - name: Print packages
        env:
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p repo/docs
          find ./repo/docs -name 'index.html' -exec rm "{}" \;
          cur_date=$(date +%Y-%m-%d)
          cur_time=$(date +%H-%M-%S)
          cur_date_time=${cur_date}_${cur_time}
          report_file_name=report-${cur_date_time}.html
          report_dir=repo/docs/reports/${cur_date}
          mkdir -p $report_dir
          report_file_path=${report_dir}/${report_file_name}
          echo "Report file path: ${report_file_path}"
          # rm -rf repo/docs/*
          # mkdir -p repo/docs
          mkdir -p html
          for f in $(find ./sarif -name *.csv); do
            csv2html -o html/$(basename ${f/.csv}).html \
            $f
          done
          :> ${report_file_path}
          echo "Creating document heading"
          echo """
          <!DOCTYPE html>
          <html>
          <head><title>Grype and Trivy report</title></head>
          <body>
          <h1>Security scan report</h1>
          <h4>Date: ${cur_date} ${cur_time}</h4>
          Generated by <a href="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID">Security Scan workflow</a>
          <br>
          Workflow event: <b>${{ github.event_name }}</b>
          <br>
          Inputs:
          <ul>Scope only HIGH + CRITICAL: <b>${{ inputs.only-high-critical }}</b></ul>
          <ul>Trivy scan: <b>${{ inputs.trivy-scan }}</b></ul>
          <ul>Grype scan: <b>${{ inputs.grype-scan }}</b></ul>
          <ul>Continue on error: <b>${{ inputs.continue-on-error }}</b></ul>
          <ul>Ignore unfixed vulnerabilities: <b>${{ inputs.only-fixed }}</b></ul>
          <br>
          <button class="collapsible">Grype Report</button>
          <div class="content">
          """ > ${report_file_path}
          for f in $(find ./html -name grype-* | sort); do
            sed -i 's/<table>/<table class="severity-table">/' $f
            criticals=$(grep -i -c '<tr><td>[^<]*</td>[^<]*<td>critical' $f || true)
            highs=$(grep -i -c '<tr><td>[^<]*</td>[^<]*<td>high' $f || true)
            mediums=$(grep -i -c '<tr><td>[^<]*</td>[^<]*<td>medium' $f || true)
            lows=$(grep -i -c '<tr><td>[^<]*</td>[^<]*<td>low' $f || true)
            title=$(basename ${f/.html})
            title=${title/grype-}
            title=${title//_/-}
            title="${title} (C:${criticals} H:${highs} M:${mediums} L:${lows})"
            # cp $f repo/docs/
            echo """
            <button class="collapsible">${title}</button>
            <div class="content">
            """ >> ${report_file_path}
            cat $f >> ${report_file_path}
            echo "</div>" >> ${report_file_path}
          done
          echo """
          </div>
          <button class="collapsible">Trivy Report</button>
          <div class="content">
          """ >> ${report_file_path}

          for f in $(find ./html -name trivy-* | sort); do
            sed -i 's/<table>/<table class="severity-table">/' $f
            criticals=$(grep -i -c '<tr><td>[^<]*</td>[^<]*<td>critical' $f || true)
            highs=$(grep -i -c '<tr><td>[^<]*</td>[^<]*<td>high' $f || true)
            mediums=$(grep -i -c '<tr><td>[^<]*</td>[^<]*<td>medium' $f || true)
            lows=$(grep -i -c '<tr><td>[^<]*</td>[^<]*<td>low' $f || true)
            title=$(basename ${f/.html})
            title=${title/trivy-}
            title=${title//_/-}
            title="${title} (C:${criticals} H:${highs} M:${mediums} L:${lows})"
            # cp $f repo/docs/
            echo """
            <button class="collapsible">${title}</button>
            <div class="content">
            """ >> ${report_file_path}
            cat $f >> ${report_file_path}
            echo "</div>" >> ${report_file_path}
          done
          echo """
            </div>
            </body>
          """ >> ${report_file_path}
          cat repo/templates/script.txt >> ${report_file_path}
      - name: Generate index.html
        uses: jayanta525/github-pages-directory-listing@624ac8c4e56893256d3772f61a88e3b14d54314e  # v4.0.0
        with:
          FOLDER: repo/docs
      - name: Commit and Push Report
        env:
          ACTOR: ${{ github.actor }}
        run: |
          cd repo
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
          git add .
          git commit -m "HTML report ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || echo "No changes"
          git push origin "gh_pages"
